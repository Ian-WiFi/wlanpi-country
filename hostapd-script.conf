# hostapd template used by wlanpi_intel.sh
#
# The script writes country_code, interface, hw_mode and channel itself on every
# run (any such lines placed here are ignored), so do not set them in this file.
# Beacons are only used to announce a country to the card under test; nothing
# ever associates, so the passphrase does not protect anything. Pick any 8+
# character value.

ieee80211d=1
driver=nl80211
ssid=LAR-TEST
ieee80211n=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=change-this-passphrase
rsn_pairwise=CCMP
wmm_enabled=1
uapsd_advertisement_enabled=1
bss_load_update_period=50
