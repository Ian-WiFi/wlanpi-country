# --- Country & 802.11d Settings (Modified by your wrapper script) ---
country_code=BZ
ieee80211d=1

# --- Target Interface ---
interface=wlan2
driver=nl80211

# --- Network Identification ---
ssid=WLAN Pi 24e

# --- Radio Settings ---
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1

# VHT Capabilities for MediaTek mt7921u
vht_oper_chwidth=0
vht_capab=[SU-BEAMFORMEE-1][MAX-AMSDU-7935]

# --- Security Parameters (WPA2-Personal) ---
auth_algs=0
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=GUR6wyA8XWQd
rsn_pairwise=CCMP

# --- QoS & BSS Load ---
wmm_enabled=1
uapsd_advertisement_enabled=1
bss_load_update_period=50
